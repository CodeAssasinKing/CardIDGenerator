[project]
name = "badge-qr-maker"
version = "1.0.0"
description = "High-performance Badge & QR Code Maker with interactive designer, Taskiq workers, and A4 printable sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "qrcode[pil]>=7.4.2",
    "taskiq[reload]>=0.11.0",
    "taskiq-nats>=0.7.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
]
